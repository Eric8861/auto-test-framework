product_detail:
  normal_cases:
    - name: "查询已上架商品"
      description: "查询前台可见的商品详情"
      product_id: 27
      expected:
        code: 200
        has_data: true
        publishStatus: 1

    - name: "查询下架商品"
      description: "下架商品在前台可能不可见"
      product_id: 1
      expected:
        code: 200

  error_cases:
    - name: "商品ID不存在"
      description: "查询不存在的商品"
      product_id: 999999
      expected:
        status: 500

    - name: "商品ID为零"
      description: "无效的商品ID"
      product_id: 0
      expected:
        status: 400

    - name: "商品ID为负数"
      description: "无效的商品ID"
      product_id: -1
      expected:
        status: 500
