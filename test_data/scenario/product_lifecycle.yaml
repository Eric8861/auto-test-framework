lifecycle:
  create_data:
    price: 199.0
    brandId: 49
    productCategoryId: 7
    stock: 100
  expected:
    create_code: 200
    portal_published:
      code: 200
      publishStatus: 1
    portal_unpublished:
      code: 200
      publishStatus: 0

unpublish_without_publish:
  create_data:
    price: 99.0
    brandId: 49
    productCategoryId: 7
  expected:
    create_code: 200
    unpublish_code: 401  # 本地服务端 unpublish 端点限权与演示环境不同

delete_idempotent:
  create_data:
    price: 99.0
    brandId: 49
    productCategoryId: 7
  expected:
    first_delete: 401  # 本地服务端 delete 端点限权与演示环境不同
    second_delete: 401
