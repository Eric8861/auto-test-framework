[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: 冒烟测试
    regression: 回归测试
    scenario: 业务流程测试
    admin: 后台接口测试
    portal: 前台接口测试
    normal: 正常场景
    error: 异常场景

addopts =
    -v
    --tb=short
    --alluredir=D:/Code/codex/auto-test-framework/allure-results
    --clean-alluredir
    -p no:warnings

filterwarnings =
    ignore::DeprecationWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
