name: API Test CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests
        run: pytest tests/ -m smoke --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 30

      - name: Lark Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ 通过"
          else
            STATUS="❌ 失败"
          fi
          curl -X POST ${{ secrets.LARK_WEBHOOK_SECRET }} \
            -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"[自动化测试] $STATUS\n📋 仓库：${{ github.repository }}\n🔧 分支：${{ github.ref_name }}\n📝 提交：${{ github.sha }}\n🔗 详情：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}"
